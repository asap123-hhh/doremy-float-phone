name: Apply shell fixes (one-shot)

# 一次性补丁：把「安卓壳直连自有站点 + 页面铺满真机屏幕」的改动提交进仓库。
# 由 .github/scripts/patch_shell_once.py 执行精确替换，跑完自行删除该脚本。
on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/patch_shell_once.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'asap123-hhh/doremy-float-phone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply patch
        run: |
          if [ ! -f .github/scripts/patch_shell_once.py ]; then
            echo "补丁脚本不存在，说明已经执行过，跳过"
            exit 0
          fi
          python3 .github/scripts/patch_shell_once.py

      - name: Commit and push
        run: |
          git config user.name "asap123-hhh"
          git config user.email "201119241+asap123-hhh@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的改动"
            exit 0
          fi
          git rm -q .github/scripts/patch_shell_once.py
          git commit -F - <<'MSG'
          安卓壳：直连自有站点，页面铺满真机屏幕

          - 移除把发往 SITE_URL 的请求全部改写到第三方镜像（float.wenyuchu0216.cc.cd）
            的 shouldInterceptRequest 代理：壳加载的必须是本仓库部署的内容，
            且所有 /api 请求不应经过第三方服务器
          - 开启 useWideViewPort / loadWithOverviewMode，关闭手势缩放，
            避免 WebView 把页面当成 980px 桌面页整体缩小、整屏分支不命中
          - 页面加载后注入 data-float-shell="1" 与整屏样式兜底
          - styles/phone-shell.css 新增 html[data-float-shell="1"] 规则：去掉金属中框、
            侧键、圆角与溢出，不再依赖会失效的 hover/pointer 媒体查询
          - versionCode 15 / versionName 1.0.16，保证覆盖安装
          MSG
          git push origin HEAD:main
