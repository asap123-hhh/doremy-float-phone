name: Apply exact alarm prompt patch (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-exact-alarm-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch
        run: python3 .github/scripts/patch_exact_alarm_ui.py
      - name: Commit and clean up
        run: |
          set -e
          git config user.name "asap123-hhh"
          git config user.email "2058761504@qq.com"
          git add -A
          git commit -m "feat: 首次启动主动申请「闹钟与提醒」权限（1.0.21）"
          git rm -q .github/scripts/patch_exact_alarm_ui.py
          git rm -q .github/workflows/apply-exact-alarm-patch.yml
          git commit -m "ci: 清理一次性补丁文件"
          git push
